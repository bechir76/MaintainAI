{{- $fullname := include "maintainai.fullname" . -}}
{{- $sel := dict "root" . "component" "api" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "maintainai.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
  selector:
    {{- include "maintainai.selector" $sel | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "maintainai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "maintainai.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maintainai.labels" . | nindent 8 }}
        {{- include "maintainai.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "maintainai.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            {{- include "maintainai.pythonEnv" . | nindent 12 }}
            - name: MCP_VIEWER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "maintainai.secretName" . }}
                  key: MCP_VIEWER_KEY
            - name: MCP_TECHNICIAN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "maintainai.secretName" . }}
                  key: MCP_TECHNICIAN_KEY
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          # Liveness only checks the process; readiness also checks the MCP server is reachable.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "maintainai.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "maintainai.tmpVolume" . | nindent 8 }}

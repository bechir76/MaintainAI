{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "maintainai.fullname" . -}}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maintainai.secretName" . }}
  labels:
    {{- include "maintainai.labels" . | nindent 4 }}
type: Opaque
stringData:
  MISTRAL_API_KEY: {{ $s.mistralApiKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.user $s.postgresPassword (include "maintainai.dbHost" .) (.Values.externalDatabase.port | default 5432) .Values.postgres.database | quote }}
  MCP_API_KEYS: {{ required "secrets.mcpApiKeys is required" $s.mcpApiKeys | quote }}
  MCP_VIEWER_KEY: {{ $s.mcpViewerKey | quote }}
  MCP_TECHNICIAN_KEY: {{ $s.mcpTechnicianKey | quote }}
{{- end }}

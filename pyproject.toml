[project]
name = "maintainai"
version = "0.1.0"
description = "Maintenance assistant for industrial equipment: tool-calling agent, RAG over manuals and live sensor data, served through MCP."
authors = [{ name = "Bechir Mnissi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pypdf>=4.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "mcp_server", "ingestion", "simulator", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "deploy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "S311", "S608", "B008", "SIM905", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"evals/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "api", "mcp_server", "ingestion", "simulator", "evals"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs Docker (Postgres + pgvector via Testcontainers)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "api", "mcp_server", "ingestion", "simulator", "evals"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
